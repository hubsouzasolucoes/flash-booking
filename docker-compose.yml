services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flash_booking
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
    # Use a non-default host port so an installed PostgreSQL cannot be mistaken
    # for this container by an application started from the IDE.
    ports: [ "${POSTGRES_PORT:-5433}:5432" ]
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=$$POSTGRES_PASSWORD psql --host=127.0.0.1 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB --tuples-only --command='SELECT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [ "postgres_data_v1:/var/lib/postgresql/data" ]

  kafka:
    image: apache/kafka:3.9.1
    ports: [ "9092:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flash_booking
      DB_USER: flash
      DB_PASSWORD: flash
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    expose: [ "8080" ]
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  proxy:
    build:
      context: ./nginx
    ports: [ "8080:8080" ]
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      app: { condition: service_healthy }

  k6:
    image: grafana/k6:0.54.0
    profiles: [ "load-test" ]
    environment:
      BASE_URL: http://proxy:8080
      EVENT_ID: ${EVENT_ID:-}
      VUS: ${VUS:-20}
      DURATION: ${DURATION:-10s}
      QUANTITY: ${QUANTITY:-1}
    volumes: [ "./load-tests:/scripts:ro" ]
    command: run /scripts/flash-sale.js
    depends_on:
      proxy: { condition: service_started }

volumes:
  # Version the local development volume when initialization credentials change.
  # PostgreSQL's image only applies POSTGRES_* to an empty data directory.
  postgres_data_v1:
