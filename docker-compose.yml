services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flash_booking
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
    ports: [ "5432:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flash -d flash_booking" ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [ "postgres_data:/var/lib/postgresql/data" ]

  kafka:
    image: apache/kafka:3.9.1
    ports: [ "9092:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flash_booking
      DB_USER: flash
      DB_PASSWORD: flash
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    expose: [ "8080" ]
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  proxy:
    image: nginx:1.27-alpine
    ports: [ "8080:8080" ]
    volumes: [ "./nginx.conf:/etc/nginx/nginx.conf:ro" ]
    depends_on:
      app: { condition: service_healthy }

  k6:
    image: grafana/k6:0.54.0
    profiles: [ "load-test" ]
    environment:
      BASE_URL: http://proxy:8080
      EVENT_ID: ${EVENT_ID:-}
      VUS: ${VUS:-20}
      DURATION: ${DURATION:-10s}
      QUANTITY: ${QUANTITY:-1}
    volumes: [ "./load-tests:/scripts:ro" ]
    command: run /scripts/flash-sale.js
    depends_on:
      proxy: { condition: service_started }

volumes:
  postgres_data:
