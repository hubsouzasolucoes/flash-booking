spring:
  application:
    name: flash-booking
  datasource:
    # Compose publishes its PostgreSQL container on host port 5433 by default.
    # The app container overrides DB_URL and still uses PostgreSQL's internal 5432.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/flash_booking}
    username: ${DB_USER:flash}
    password: ${DB_PASSWORD:flash}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,kafka
    prometheus:
      access: read_only
  info:
    env:
      enabled: true
info:
  app:
    name: Flash Booking API
    version: '@project.version@'
logging:
  pattern:
    level: "%5p correlationId=%X{correlationId:-none}"
app:
  reservation-ttl: ${RESERVATION_TTL:PT10M}
  outbox-fixed-delay: ${OUTBOX_FIXED_DELAY_MS:1000}
  expiration-fixed-delay: ${EXPIRATION_FIXED_DELAY_MS:5000}
  kafka:
    events-topic: ${KAFKA_EVENTS_TOPIC:booking.domain-events}
    consumer-group: ${KAFKA_CONSUMER_GROUP:flash-booking-availability-v1}
