spring:
  application.name: flash-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flash_booking}
    username: ${DB_USER:flash}
    password: ${DB_PASSWORD:flash}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
server:
  port: 8080
springdoc:
  swagger-ui.path: /swagger-ui.html
management.endpoints.web.exposure.include: health,info,metrics
app:
  reservation-ttl: PT10M
  outbox-fixed-delay: 1000
  expiration-fixed-delay: 5000
