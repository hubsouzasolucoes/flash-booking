spring:
  application:
    name: flash-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flash_booking}
    username: ${DB_USER:flash}
    password: ${DB_PASSWORD:flash}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
server:
  port: ${SERVER_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
app:
  reservation-ttl: ${RESERVATION_TTL:PT10M}
  outbox-fixed-delay: ${OUTBOX_FIXED_DELAY_MS:1000}
  expiration-fixed-delay: ${EXPIRATION_FIXED_DELAY_MS:5000}
  kafka:
    events-topic: ${KAFKA_EVENTS_TOPIC:booking.domain-events}
    consumer-group: ${KAFKA_CONSUMER_GROUP:flash-booking-availability-v1}
